id: terminal
titre: Le terminal
version: 1
resume: Le vrai terminal de ton ordinateur, dans ton harnais. Trois commandes suffisent pour commencer.
requiert: [chat]
prete: [terminal.eleve]
debloque: [terminal.eleve]
preuves:
  - type: terminal.commande
    motif: "^node (--version|-v)$"
  - type: terminal.commande
    motif: "^(cd|Set-Location|sl|chdir)\\s+.*missions"
  - type: terminal.commande
    motif: "^(ls|dir|Get-ChildItem|gci)(\\s|$)"
indice: "Dans la zone de saisie, tape /terminal puis Entrée : le terminal s'ouvre en bas. Clique dedans, tape chaque commande, puis appuie sur Entrée (pas dans la conversation avec l'IA). Si « node » n'est pas reconnu, demande de l'aide à ton IA."
